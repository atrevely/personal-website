name: deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
      - "scripts/check_site.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  BUCKET: ajtrev.com
  DISTRIBUTION_ID: E3PNNSDLVB4LOK

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_site.py site

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for AWS OIDC
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::958373514345:role/ajtrev-site-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Only site/ is ever synced. Order matters so visitors never see a page
      # that references a missing file: assets first, then HTML, then delete
      # anything no longer in the repo (the bucket is versioned, so removed
      # objects remain recoverable).
      # Browser caching: HTML 5 min so edits show up quickly; everything else
      # 1 day. To change an asset immediately for returning visitors, rename it.
      - name: Upload assets
        run: >
          aws s3 sync site/ "s3://${BUCKET}" --no-progress
          --exclude "*.html"
          --cache-control "public, max-age=86400"

      - name: Upload HTML
        run: >
          aws s3 sync site/ "s3://${BUCKET}" --no-progress
          --exclude "*" --include "*.html"
          --cache-control "public, max-age=300"

      # --size-only: everything was just uploaded, so this pass only deletes.
      - name: Remove files no longer in the repo
        run: aws s3 sync site/ "s3://${BUCKET}" --no-progress --delete --size-only

      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/*" \
            --query Invalidation.Id --output text)
          echo "Invalidation $id"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"
